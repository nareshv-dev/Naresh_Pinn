[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-ev-battery"
version = "1.0.0"
description = "Physics-consistent electrochemical-thermal PINN with concentration-coupled particle stress"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "ElectroPINN-Labs"}
]
keywords = ["PINN", "battery", "lithium-ion", "PyBaMM", "electrochemical", "thermal"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pybamm>=26.8.0,<27.0.0",
    "torch>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0,<2.0.0",
    "h5py>=3.10.0,<4.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=15.0.0,<20.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "psutil>=5.9.0,<6.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
