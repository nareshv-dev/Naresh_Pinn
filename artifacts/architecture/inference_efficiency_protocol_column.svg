<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060"><defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17324D"/></marker></defs><rect x="0" y="0" width="1200" height="1060" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><rect x="145" y="30" width="910" height="185" rx="28" fill="#EAF4FF" stroke="#2474C6" stroke-width="5"/><text x="600" y="86" font-family="Arial, Segoe UI, sans-serif" font-size="39" font-weight="850" fill="#2474C6" text-anchor="middle">1  HELD-OUT QUERY BATCH</text><text x="600" y="145" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="650" fill="#17324D" text-anchor="middle">Same C-rate, ambient temperature,</text><text x="600" y="190" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="650" fill="#17324D" text-anchor="middle">time grid, batch size, and outputs</text><line x1="600" y1="215" x2="600" y2="255" stroke="#17324D" stroke-width="7" stroke-linecap="round"/><line x1="300" y1="255" x2="900" y2="255" stroke="#17324D" stroke-width="7" stroke-linecap="round"/><line x1="300" y1="255" x2="300" y2="292" stroke="#17324D" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="900" y1="255" x2="900" y2="292" stroke="#17324D" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="55" y="315" width="520" height="255" rx="26" fill="#E8F7F0" stroke="#18845E" stroke-width="5"/><text x="315" y="370" font-family="Arial, Segoe UI, sans-serif" font-size="39" font-weight="850" fill="#18845E" text-anchor="middle">2A  PINN TIMING</text><text x="315" y="430" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#17324D" text-anchor="middle">100 warm-up calls</text><text x="315" y="476" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#17324D" text-anchor="middle">synchronized execution</text><text x="315" y="520" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#17324D" text-anchor="middle">median and P95 latency</text><text x="315" y="555" font-family="Arial, Segoe UI, sans-serif" font-size="31" font-weight="800" fill="#18845E" text-anchor="middle">median t(PINN)</text><rect x="625" y="315" width="520" height="255" rx="26" fill="#FFF2E2" stroke="#C96A05" stroke-width="5"/><text x="885" y="370" font-family="Arial, Segoe UI, sans-serif" font-size="39" font-weight="850" fill="#C96A05" text-anchor="middle">2B  SPMe TIMING</text><text x="885" y="430" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#17324D" text-anchor="middle">identical hardware</text><text x="885" y="476" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#17324D" text-anchor="middle">identical held-out queries</text><text x="885" y="520" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#17324D" text-anchor="middle">solver wall-clock latency</text><text x="885" y="555" font-family="Arial, Segoe UI, sans-serif" font-size="31" font-weight="800" fill="#C96A05" text-anchor="middle">median t(SPMe)</text><path d="M 315 570 L 315 625 L 570 625 L 570 657" fill="none" stroke="#17324D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 885 570 L 885 625 L 630 625 L 630 657" fill="none" stroke="#17324D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="145" y="680" width="910" height="285" rx="28" fill="#F4EBFF" stroke="#7A3FC1" stroke-width="5"/><text x="600" y="735" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="850" fill="#7A3FC1" text-anchor="middle">3  EFFICIENCY METRIC</text><text x="600" y="810" font-family="Arial, Segoe UI, sans-serif" font-size="39" font-weight="800" fill="#17324D" text-anchor="middle">Speedup = median t(SPMe) / m